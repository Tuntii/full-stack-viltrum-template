<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>@{page.title} · Viltrum dashboard</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=4" />
</head>
<body class="app">
  <aside class="rail">
    <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="40" height="40" />Viltrum</a>
    <nav class="rail-nav" aria-label="Dashboard">@{rail}</nav>
    <div class="rail-foot">@{rail_foot}</div>
  </aside>
  <div class="work">
    <header class="bar">
      <h1>Account</h1>
      <span class="api">JSON: GET /api/v1/users/me</span>
    </header>
    <main class="pane">
      <dl class="meta">
        <dt>Email</dt><dd>@{page.email}</dd>
        <dt>Name</dt><dd>@{full_name}</dd>
        <dt>Role</dt><dd>@{role}</dd>
        <dt>Id</dt><dd class="mono">@{user_id}</dd>
      </dl>
      <div class="hint">
        <p>Your session is an HttpOnly cookie that lasts seven days. The JSON API accepts the same cookie, or a Bearer token from POST /api/v1/login/access-token.</p>
        <form method="post" action="/logout"><button type="submit" class="plate plate-quiet">Sign out</button></form>
      </div>
    </main>
  </div>
  <script src="/static/live.js?v=4" defer></script>
</body>
</html>
