<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>@{page.title} · Viltrum dashboard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=5" />
</head>
<body class="app">
  <aside class="rail">
    <a class="brand" href="/"><img src="/static/logo-white.svg" alt="" width="40" height="40" />Viltrum</a>
    <nav class="rail-nav" aria-label="Dashboard">@{rail}</nav>
    <div class="rail-foot">@{rail_foot}</div>
  </aside>
  <div class="work">
    <header class="bar">
      <h1>Items</h1>
      <span class="count">@{count}</span>
      <span class="api">JSON: GET /api/v1/items/ with this cookie or a Bearer token</span>
    </header>
    <main class="pane">
      <p class="flash" role="status">@{page.flash}</p>
      <form class="composer" method="post" action="/items">
        <label class="field">
          <span>Title</span>
          <input name="title" required maxlength="200" placeholder="New item" />
        </label>
        <label class="field">
          <span>Description</span>
          <input name="description" maxlength="2000" placeholder="Optional" />
        </label>
        <button type="submit" class="plate">Add item</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Id</th><th>Title</th><th>Description</th><th class="opt">Owner</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody>@{rows}</tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="/static/live.js?v=5" defer></script>
</body>
</html>
