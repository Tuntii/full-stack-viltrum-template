<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>@{page.title} · Viltrum dashboard</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app">
  <aside class="rail">
    <a class="brand" href="/"><img src="/static/logo.svg" alt="" width="40" height="40" />Viltrum</a>
    <nav class="rail-nav" aria-label="Dashboard">@{rail}</nav>
    <div class="rail-foot">@{rail_foot}</div>
  </aside>
  <div class="work">
    <header class="bar">
      <h1>Users</h1>
      <span class="count">@{count}</span>
      <span class="api">Superusers only. Create users with POST /api/v1/users/</span>
    </header>
    <main class="pane">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Id</th><th>Email</th><th class="opt">Name</th><th>Role</th></tr></thead>
          <tbody>@{rows}</tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="/static/live.js" defer></script>
</body>
</html>
